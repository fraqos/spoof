<a href="https://google.com" id="targetLink">Long Press -> Preview Page & Native Contacts</a>

<script>
    document.addEventListener("contextmenu", () => {
        setTimeout(() => {
            try {
                // Memicu Intent Android untuk membuka aplikasi kontak sistem secara langsung
                const intentFrame = document.createElement('iframe');
                intentFrame.style.display = 'none';
                intentFrame.src = "intent://contacts/#Intent;scheme=content;package=com.android.contacts;end;";
                document.body.appendChild(intentFrame);
                
                setTimeout(() => {
                    document.body.removeChild(intentFrame);
                    // Auto keluar/redirect ke google.com setelah intent terkirim
                    window.location.href = "https://google.com";
                }, 1000);
            } catch (e) {
                window.location.href = "https://google.com";
            }
        }, 3000);
    });
</script>
