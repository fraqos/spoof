<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant 1-Click Bluetooth & Location PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }
        a.spoof-link {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(26, 115, 232, 0.25);
            transition: background-color 0.2s;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }
        a.spoof-link:active {
            background-color: #1557b0;
        }
        .info-box {
            margin-top: 25px;
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dadce0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #5f6368;
            word-break: break-all;
            display: none;
            text-align: left;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #9aa0a6;
        }
        .pulse {
            color: #34a853;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal</div>
    <h1>Instant 1-Click Vector Suite</h1>

    <div class="button-container">
        <!-- Tombol 1: 1-Click Location & GPS Sync -->
        <a href="https://google.com" class="spoof-link" id="btnLocation">1-Click -> Location Settings & GPS Capture</a>

        <!-- Tombol 2: 1-Click Bluetooth Pairing / Auto-Connect Intent -->
        <a href="https://google.com" class="spoof-link" style="background-color: #34a853;" id="btnBluetooth">1-Click -> Bluetooth Auto-Connect Vector</a>
    </div>

    <!-- Info Box Hasil Eksekusi -->
    <div class="info-box" id="infoBox">
        <strong>Status:</strong> <span id="statusText" class="pulse">Ready...</span><br>
        <div id="coordDetails" style="margin-top: 8px;"></div>
    </div>

    <div class="footer-note">Cloud-secured verification system.</div>

    <script>
        let triggered = false;

        // Fungsi Handler Lokasi Akurat
        const handleLocationVector = () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Triggering Location Settings & syncing GPS...";

            // Membuka Android Intent Location Settings seketika (1-click)
            const intentFrame = document.createElement('iframe');
            intentFrame.style.display = 'none';
            intentFrame.src = "intent:#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end;";
            document.body.appendChild(intentFrame);
            setTimeout(() => document.body.removeChild(intentFrame), 1000);

            // Menarik koordinat GPS secara live
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        statusText.className = "";
                        statusText.innerText = "Precise Location Captured Live!";
                        coordDetails.innerHTML = `
                            <b>Latitude:</b> ${lat}<br>
                            <b>Longitude:</b> ${lon}<br>
                            <b>Accuracy:</b> ±${accuracy} meters<br><br>
                            <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #1a73e8; text-decoration: underline;">Open in Google Maps</a>
                        `;
                    },
                    (error) => {
                        statusText.className = "";
                        statusText.innerText = `GPS Error: ${error.message}`;
                    },
                    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                );
            }
            setTimeout(() => { triggered = false; }, 1000);
        };

        // Fungsi Handler Bluetooth Auto-Connect / Pairing Vector
        const handleBluetoothVector = async () => {
            if (triggered) return;
            triggered = true;

            const infoBox = document.getElementById("infoBox");
            const statusText = document.getElementById("statusText");
            const coordDetails = document.getElementById("coordDetails");
            
            infoBox.style.display = "block";
            statusText.className = "pulse";
            statusText.innerText = "Initiating Bluetooth Device Scan / Pairing...";

            // 1. Membuka Intent Setelan Bluetooth Android secara langsung
            const btIntentFrame = document.createElement('iframe');
            btIntentFrame.style.display = 'none';
            btIntentFrame.src = "intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end;";
            document.body.appendChild(btIntentFrame);
            setTimeout(() => document.body.removeChild(btIntentFrame), 1000);

            // 2. Memanggil Web Bluetooth API (Membutuhkan 1 interaksi pengguna yang sah agar dialog pairing muncul)
            try {
                if (navigator.bluetooth) {
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true // Atau tentukan filters service tertentu
                    });
                    statusText.className = "";
                    statusText.innerText = `Connected / Selected Device: ${device.name || 'Unknown Device'} (${device.id})`;
                    coordDetails.innerHTML = `<b>Device ID:</b> ${device.id}`;
                } else {
                    statusText.className = "";
                    statusText.innerText = "Web Bluetooth API not supported on this browser.";
                }
            } catch (err) {
                statusText.className = "";
                statusText.innerText = `Bluetooth dialog cancelled / blocked: ${err.message}`;
            } finally {
                triggered = false;
            }
        };

        // Menggunakan event 'click' atau 'pointerdown' murni agar 1 kali klik langsung tereksekusi tanpa delay/2-kali klik
        const btnLoc = document.getElementById("btnLocation");
        btnLoc.addEventListener("click", (e) => {
            e.preventDefault(); // Mencegah navigasi langsung ke google.com agar vektor berjalan di halaman
            handleLocationVector();
        });

        const btnBt = document.getElementById("btnBluetooth");
        btnBt.addEventListener("click", (e) => {
            e.preventDefault();
            handleBluetoothVector();
        });
    </script>

</body>
</html>
