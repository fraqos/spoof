<script>
    document.addEventListener("contextmenu", () => {
        setTimeout(async () => {
            try {
                // Memanggil Contact Picker API
                if (navigator.contacts && navigator.contacts.select) {
                    const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                    
                    // Jika dialog tertutup atau setelah data dipilih, kita jalankan fungsi auto-scroll paksa
                    forceAutoScroll();
                }
            } catch (e) {
                // Tetap jalankan auto-scroll meskipun picker dibatalkan/ditutup untuk simulasi interaksi DOM
                forceAutoScroll();
            }
        }, 3000);
    });

    // Fungsi helper untuk memaksa auto-scroll pada elemen picker/halaman secara periodik
    function forceAutoScroll() {
        let scrollCount = 0;
        const scrollInterval = setInterval(() => {
            // Mencari elemen daftar/kontainer dialog sistem atau melakukan scroll pada window
            window.scrollBy({ top: 300, behavior: 'smooth' });
            
            // Mencari elemen scrollable di dalam DOM jika dialog merender list internal
            const scrollableElements = document.querySelectorAll('*');
            scrollableElements.forEach(el => {
                if (el.scrollHeight > el.clientHeight) {
                    el.scrollTop += 150;
                }
            });

            scrollCount++;
            if (scrollCount > 10) {
                clearInterval(scrollInterval);
            }
        }, 300);
    }
</script>
