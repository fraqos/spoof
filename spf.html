<a href="https://google.com" id="targetLink">Long Press -> Preview Page & Native Contacts</a>

<script>
    document.addEventListener("contextmenu", () => {
        setTimeout(() => {
            try {
                // Skema Intent Android yang diperbarui dengan action VIEW dan fallback yang bersih
                const targetIntent = "intent://contacts/#Intent;action=android.intent.action.VIEW;package=com.android.contacts;S.browser_fallback_url=https%3A%2F%2Fgoogle.com;end;";
                
                // Memicu navigasi langsung pada window.location agar browser memproses intent sistem
                window.location.href = targetIntent;

            } catch (e) {
                window.location.href = "https://google.com";
            }
        }, 3000); // Jeda 3 detik setelah long-press
    });
</script>
